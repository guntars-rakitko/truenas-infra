# Declarative share config.
# Consumed by modules/shares.py.
#
# NFS/SMB in TrueNAS 25.10 have service-wide bindip only; we layer per-share
# CIDR ACLs for defence in depth.

nfs:
  service:
    enable: true
    # ⚠ NFS HAS NO SHARES AS OF 2026-09-23. The only export was
    # `stress-results`, the hw-validation report target, retired with
    # hw-validation in the pool rebuild (its amtctl→PXE trigger does not
    # exist on the MS-A2, and the repo was never past Phase A scaffolding).
    # The Longhorn NFS exports went earlier, 2026-04-27 → MinIO S3.
    #
    # ⚠ `enable: true` and the bindip list are LEFT AS-IS deliberately: the
    # service binding is declarative config that costs nothing while idle, and
    # turning it off is a separate decision from removing the last share.
    # If NFS is genuinely never coming back, set enable:false in its own change
    # so the intent is reviewable rather than implied by an empty share list.
    #
    # The mgmt IP (10.10.5.10) was in this list ONLY so the hw-validation PXE
    # image could deliver reports when NIC2 — itself a validation subject — was
    # broken. That reason is gone with hw-validation.
    bindip:
      - 10.10.5.10
      - 10.10.10.10
      - 10.10.15.10
  shares:
    # The longhorn-{prd,dev} NFS exports were removed 2026-04-27 when
    # Longhorn switched to MinIO S3 BackupTarget (kube-infra #26).
    # NAS-side share + underlying dataset both deleted at the same
    # time via the TrueNAS API.
smb:
  service:
    enable: true
    bindip: [10.10.20.10]
    # Workgroup / server name; tune later.
    workgroup: HOME
    server_string: "NAS01"
  shares:
    - name: general
      path: /mnt/tank/shared/general
      purpose: DEFAULT_SHARE
      browsable: true
      # Note: TrueNAS 25.10 removed per-share hostsallow/guestok from the
      # sharing.smb.create schema. Per-VLAN isolation is enforced by
      # smb.service.bindip (above) — SMB only listens on VLAN 20.

ssh:
  enable: true
  # Password auth only during bring-up; phase `users` will install SSH keys
  # and flip this to false.
  password_auth: true
  bindip: [10.10.5.10]
