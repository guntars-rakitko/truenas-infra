# Static wiki host — serves the MkDocs-built `site/` from the wiki repo.
#
# Content uploaded through the TrueNAS API from the operator laptop:
#   cd ~/github/wiki && ./tools/deploy.sh --verify
# Since 2026-11-22 (wiki#295) `site/` is its own dataset,
# tank/system/apps-config/wiki/site: each deploy builds the next release in
# wiki/site-next, then stops this app, renames site → site-prev and
# site-next → site, and starts it again (the wiki repo's
# docs/runbooks/wiki-deploy.md). nginx serves read-only from that dir; no
# credentials, no DB, no admin surface.
#
# Fronted by Traefik (wiki.w1.lv → http://10.10.5.10:8088) — see
# apps/traefik/routes.yaml. nginx only binds on mgmt-VLAN IP.
services:
  wiki:
    image: nginx:1.31-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    container_name: wiki
    restart: unless-stopped
    ports:
      # Mgmt VLAN bind only. Port 8088 picked clear of
      # :9001 minio-prd-console and :9011 minio-dev-console (and of the
      # retired PXE/MeshCentral ports it was first chosen around).
      - "10.10.5.10:8088:80"
    volumes:
      - /mnt/tank/system/apps-config/wiki/site:/usr/share/nginx/html:ro
      - /mnt/tank/system/apps-config/wiki/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

networks:
  default:
    driver: bridge
