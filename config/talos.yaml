# Talos PXE updater config — consumed by apps/pxe/talos-updater.sh
# via env vars set from `cronjob.command` in modules/apps.py.

# Version selection.
#   - "latest" → poll GitHub for the most-recent tag and track it.
#   - "vX.Y.Z" → pin to that exact release.
version: latest

# Retention — keep the newest N downloaded versions on disk, delete older.
# Takes effect AFTER a successful download (so if we drop from latest to a
# pin + retention=1, the previously-downloaded latest survives until a
# successful fetch of the pinned version).
retention: 5

# Architecture + platform baked into the generated iPXE menu entries.
architecture: amd64
platform: metal

# System extensions + kernel args are NOT configured here.
#
# The canonical schematic is `apps/pxe/schematic.yaml` — that is the file
# talos-updater.sh POSTs to factory.talos.dev (via SCHEMATIC_FILE), and it must
# stay byte-identical to `kube-infra/talos-os/schematic.yaml`.
#
# This file is parsed by `load_talos_config()` in
# src/truenas_infra/modules/apps.py, which reads exactly four keys: version,
# retention, architecture, platform. Nothing else here is consumed.
#
# An `extensions:` list previously lived at this spot as a "mirror" of the
# schematic. It was never read by any code, so nothing kept it honest, and it
# drifted: it still listed `nut-client` (stripped from the node image
# 2026-06-02, kube-infra #611) and `gvisor` (never in the real schematic),
# while omitting `iscsi-tools` and `util-linux-tools` (both required by
# Longhorn). Its comment also claimed edits here "WILL force a new schematic
# ID on the next updater run" — false; only SCHEMATIC_FILE does that.
# Deleted 2026-09-13 rather than corrected: a second copy with no consumer is
# a drift generator, not documentation.
