# Declarative network config.
# Consumed by `modules/network.py` (phase: network).
# Source of truth for every sub-interface.
#
# ⚠️  WIKI MIRROR: Changing the NAS hostname, NIC role, or any IP/sub-IP
#     here ALSO requires updating:
#       wiki/docs/architecture/ip-plan.md     (NAS static allocations)
#       wiki/docs/architecture/tls-split-horizon.md  (if mgmt/data split changes)
#     Then: cd ~/github/wiki && ./tools/deploy.sh --verify

# Physical NIC assignments.
# Beelink ME Mini device names (verified 2026-05-15 via lspci/ethtool/dmesg
# on the post-RMA install). Both NICs are Intel I226-V 2.5GbE controllers
# (PCI ID 8086:125c, driver igc, firmware 2025:8a6) — same chipset family
# as the kube cluster's data NICs, mature mainline kernel support, no
# ASPM/TX-stall quirks. Each NIC is on its own PCIe 3.0 x1 lane (~4 Gb/s).
#
#   enp1s0 (bus 0000:01:00.0, MAC 78:55:36:07:25:93) — Intel I226-V = trunk (ether7 on CRS310)
#   enp2s0 (bus 0000:02:00.0, MAC 78:55:36:07:25:92) — Intel I226-V = mgmt  (ether8 on CRS310)
nics:
  # Mgmt NIC (untagged VLAN 5).
  mgmt:
    device: enp2s0
    role: management
    vlan: null            # untagged
    ipv4: 10.10.5.10/24
    gateway: 10.10.5.1    # router interface on VLAN 5
    mtu: 1500
    # Extra IPs bound alongside the primary. Each hosts its own :443 so
    # we can run multiple mgmt HTTPS services on this single VLAN without
    # collisions. 10.10.5.20 is the Traefik reverse proxy.
    additional_ips:
      - 10.10.5.20/24

  # Trunk NIC (tagged VLANs 10/15/20).
  # Physical interface itself has no IP; sub-interfaces below.
  trunk:
    device: enp1s0
    role: data
    mtu: 1500
    vlans:
      - vid: 10
        name: vlan10
        ipv4: 10.10.10.10/24
        purpose: prd Kube — NFS, MinIO
      - vid: 15
        name: vlan15
        ipv4: 10.10.15.10/24
        purpose: dev Kube — NFS, MinIO
      - vid: 20
        name: vlan20
        ipv4: 10.10.20.10/24
        purpose: home — SMB, (future) Plex/torrent

# Global resolver/NTP config.
dns:
  servers: [10.10.0.1]
  search: [w1.lv]
ntp:
  servers: [10.10.0.1]

# Hostname / domain. Singleton-role naming: just `nas` (not `nas-01`).
# The host's self-reported hostname matches the canonical DNS name
# `nas.w1.lv` — keeps $HOSTNAME / SSH banner / mDNS consistent with the
# outward-facing URL.
hostname: nas
domain: w1.lv
