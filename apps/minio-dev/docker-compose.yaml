# AIStor Free license, surfaced inside the container as /minio.license.
# Content comes from Doppler infrastructure/ops → MINIO_AISTOR_LICENSE,
# substituted at deploy time by truenas-infra _render_compose. AIStor
# Free gates S3 data-plane operations on a valid license — without it
# `mc ls` etc. fail with "License has fully expired".
configs:
  minio_license:
    content: "${MINIO_AISTOR_LICENSE}"

services:
  minio:
    # MinIO AIStor Free — official maintained successor to the
    # open-source minio/minio (archived 2026-04-25). See
    # minio-prd/docker-compose.yaml for the full rationale. AIStor IS
    # MinIO — naming stays minio-* / MINIO_*.
    image: quay.io/minio/aistor/minio:RELEASE.2026-05-04T23-02-27Z@sha256:9510e5f116c2e507a042f328b77992c651dcdd04ab79e676bb85f13e2aa8363a
    container_name: minio-dev
    restart: unless-stopped
    network_mode: bridge
    ports:
      # S3 API on dev VLAN (data plane). HTTPS, wildcard *.w1.lv cert.
      # Native S3 port :9000; :443 on 10.10.15.10 reserved for future.
      - "10.10.15.10:9000:9000"
      # Console on mgmt VLAN IP — port :9011 distinguishes it from
      # minio-prd's :9001 (same mgmt IP, different host port).
      # Traefik routes https://minio-dev.w1.lv/ → http://10.10.5.10:9011.
      - "10.10.5.10:9011:9001"
    volumes:
      - /mnt/tank/kube/dev/velero:/data
      - /mnt/tank/system/tls:/root/.minio/certs:ro
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_SERVER_URL=https://s3-dev.w1.lv:9000
      - MINIO_BROWSER_REDIRECT_URL=https://minio-dev.w1.lv/
      # KMS root key for SSE-S3 default encryption (GDPR at-rest,
      # kube-infra #520 Workstream C). Format <key-name>:<base64-32-bytes>.
      # Sourced from Doppler infrastructure/ops → MINIO_KMS_SECRET_KEY_DEV.
      - MINIO_KMS_SECRET_KEY=${MINIO_KMS_SECRET_KEY}
    configs:
      - source: minio_license
        target: /minio.license
    # --certs-dir set explicitly — pins the cert path regardless of any
    # AIStor default-path change vs the old minio/minio. --license points
    # AIStor at the Free-tier license (configs: block at the top of this
    # file) — required for S3 data-plane operations.
    command: server /data --console-address ":9001" --certs-dir /root/.minio/certs --license /minio.license
