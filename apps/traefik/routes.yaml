# Traefik file-provider dynamic config.
#
# Lands at /mnt/tank/system/apps-config/traefik/routes.yaml via
# ensure_file_on_nas (phase apps). Traefik watches the directory and
# hot-reloads on change — no redeploy needed when adding a route.
#
# ⚠️  WIKI MIRROR: Adding/removing a route here ALSO requires updating:
#       wiki/docs/architecture/hostnames.md  (admin plane table; a `devapi` route: the data-plane table)
#       wiki/docs/reference/links.md         (internal dashboards)
#       mikrotik-infra/configs/dns.yaml      (new *.w1.lv → 10.10.5.20 record, or the dev-VLAN 10.10.15.10
#                                             for a `devapi` route;
#                                             the only DNS declaration — verify
#                                             reads it from there)
#     Then: ./manage.sh phase apps --apply (re-uploads this file) &&
#           cd ~/github/mikrotik-infra && ./manage.sh ("Sync DNS static records") &&
#           cd ~/github/wiki && ./tools/deploy.sh --verify
#
# Pattern:
#   <name>.w1.lv  →  HTTP backend URL  (plain HTTP inside mgmt VLAN)
#   TLS terminated at Traefik using /etc/traefik/certs/fullchain.pem.
#   ⚠ Editing THIS file hot-reloads. A renewed cert does NOT: nothing watches
#   /etc/traefik/certs, so apps/tls/tls-rotate.sh redeploys Traefik when the
#   cert changes.

http:
  routers:
    minio-prd-console:
      rule: "Host(`minio-prd.w1.lv`)"
      service: minio-prd-console
      entryPoints: [websecure]
      tls: {}
    minio-dev-console:
      rule: "Host(`minio-dev.w1.lv`)"
      service: minio-dev-console
      entryPoints: [websecure]
      tls: {}
    # Internal wiki — MkDocs static site served by nginx on mgmt VLAN.
    # Content pushed from the wiki repo's tools/deploy.sh (rsync).
    wiki:
      rule: "Host(`wiki.w1.lv`)"
      service: wiki
      entryPoints: [websecure]
      tls: {}
    # Bambuddy — Bambu Lab printer control + spool inventory (apps/bambuddy).
    # ⚠ The hostname is printed in every spool's QR label: never rename it.
    # HTTPS is what lets its live QR scanner open on a phone. Traefik passes
    # WebSocket upgrades through by default, which the UI needs.
    bambuddy:
      rule: "Host(`bambuddy.w1.lv`)"
      service: bambuddy
      entryPoints: [websecure]
      tls: {}
    # Bambuddy's API for an app on msa2-dev (the operator's choice of 2026-11-24): on the NAS's dev-VLAN address
    # 10.10.15.10:8000 (the `devapi` entry point), so the dev cluster reaches it without a router rule into the mgmt
    # VLAN. Only the paths that app calls: the queue, library files, archives (runs, photos, timelapses) and the
    # media token, each needing a Bambuddy API key. Bambuddy's key-less routes stay off the dev VLAN: its login,
    # setup, password reset and the rest of /api/v1/auth/, and, inside the routed prefixes, the archive verdict
    # (/archives/confirm/) and the token-in-path slicer downloads (/dl/, /source-dl/, /media/dl/). So does the UI.
    bambuddy-api-dev:
      rule: "Host(`bambuddy-api-dev.w1.lv`) && (PathPrefix(`/api/v1/queue/`) || PathPrefix(`/api/v1/library/files`) || PathPrefix(`/api/v1/archives/`) || Path(`/api/v1/auth/media-token`)) && !PathRegexp(`/(confirm|dl|source-dl)/`)"
      service: bambuddy
      entryPoints: [devapi]
      tls: {}
  services:
    minio-prd-console:
      loadBalancer:
        servers:
          # MinIO console is HTTPS (uses the wildcard cert from
          # --certs-dir; MinIO can't split TLS between :9000 S3 and :9001
          # console — same cert config on both). We connect via IP so
          # the hostname on the cert doesn't match (*.w1.lv vs raw IP),
          # hence serversTransport=insecure-backend. The hop is on NAS
          # loopback — no wire exposure.
          - url: "https://10.10.5.10:9001"
        serversTransport: insecure-backend
    minio-dev-console:
      loadBalancer:
        servers:
          - url: "https://10.10.5.10:9011"
        serversTransport: insecure-backend
    wiki:
      loadBalancer:
        servers:
          # nginx:alpine in the `wiki` Custom App. Host port 8088 chosen
          # clear of every other service bound on 10.10.5.10.
          - url: "http://10.10.5.10:8088"
    bambuddy:
      loadBalancer:
        servers:
          # Plain HTTP; host port 8000, mgmt-VLAN bind only.
          - url: "http://10.10.5.10:8000"
  serversTransports:
    insecure-backend:
      insecureSkipVerify: true

tls:
  certificates:
    - certFile: /etc/traefik/certs/fullchain.pem
      keyFile: /etc/traefik/certs/privkey.pem
