# Declarative service config.
# Consumed by modules/nut.py, modules/tls.py, module helpers.

nut:
  enable: true
  # TrueNAS NUT is singleton — one UPS per `ups.config`. The list format
  # was aspirational; we use the first entry.
  identifier: apc1
  description: "APC Smart-UPS (primary)"
  # Driver string format is "<driver>$<model>" (see ups.driver_choices).
  # LIVE driver since the UPS-observability work: apcsmart, reaching the
  # UPS's DB-9 (APC "Legacy Communication Card") through a USB→RS-232
  # adapter on the Beelink (the mini-PC has no native serial port).
  # Migrated from usbhid-ups/$/dev/uhid because apcsmart surfaces far more
  # telemetry (output.current, input.voltage.min/max, input.frequency,
  # ups.temperature, …) that the HID path never exposed — this is what
  # feeds the kube-infra UPS Grafana dashboard. Verified live 2026-05-30:
  #   driver = apcsmart$Smart-UPS, port = /dev/ttyUSB0, driver.version 2.8.0.
  #
  # ⚠️ USB-TEARDOWN CAVEAT (root cause of the DR shutdown bug, #57):
  # /dev/ttyUSB0 is a USB-backed tty. During NAS poweroff the kernel
  # removes the USB-serial adapter BEFORE TrueNAS's `powerdown` killpower
  # step runs, so `shutdown.return` never reaches the UPS — on a real
  # outage the UPS keeps powering the (already-dead) load until the battery
  # is flat, then a second uncontrolled outage when utility returns. apcsmart
  # over a *native* RS-232 port would not have this problem, but the
  # hardware has none; the working fix is to deliver the UPS power-off
  # command up-front, while USB comms are still alive — see the wiki runbook
  # `ups-operations.md` § "DR shutdown fix" (validate via Drill A).
  driver: "apcsmart$Smart-UPS"
  port: /dev/ttyUSB0
  mode: MASTER                      # this NAS runs the NUT server
  # Service-level bindip isn't a field on ups.config in 25.10 — NUT listens
  # on the port globally and we rely on mikrotik-infra firewall + the fact
  # that only VLAN 5 routes to the NAS for management traffic.
  remoteport: 3493
  # Remote Monitor — allow remote NUT clients (in-cluster nut-exporter on
  # 10.10.5.10:3493, future Talos-side upsmon slaves) to connect to upsd.
  # Without this, upsd refuses non-loopback queries with "Access denied"
  # and the kube-infra nut-exporter scrape fails. Enabled live via UI on
  # 2026-05-16; codified here so the next `phase nut --apply` won't drift
  # it back off. Maps to `ups.config.rmonitor`.
  rmonitor: true
  # LOWBATT is the right shutdown trigger for our load profile: the
  # Beelink NAS draws ~25 W and 6× kube nodes ~320 W on a Smart-UPS SMT750
  # (~500 VA usable) — the UPS sustains the whole rack ~5–8 min on battery.
  # The previous BATT + 30s combo killed the NAS on every ≥30s utility
  # blip, including the routine 90s grid hiccups we see in this neighborhood
  # (5 events in May 2026 so far). LOWBATT defers shutdown until the UPS
  # signals "battery low" — gives the cluster the full runtime envelope
  # and only kills services when power genuinely won't return in time.
  # shutdowntimer still applies as a grace before init 0 once the trigger
  # fires. Set to 30s (was 60) 2026-05-30 to match the intended DR flow
  # ("~30s after LB the NAS shuts itself down + arms the UPS power-off").
  # NB: in LOWBATT mode TrueNAS may shut down on the LB signal regardless of
  # this timer — confirm the actual grace during Drill A. Apply live with:
  #   sudo midclt call ups.update '{"shutdowntimer": 30}'   (then RESTART ups)
  shutdown: LOWBATT
  shutdowntimer: 30                 # grace seconds after shutdown trigger fires
  # monuser/monpwd for NUT clients (K8s nodes connect as these).
  # monuser: declared here.
  # monpwd: NOT in YAML — read from Doppler `TRUENAS_NUT_MONPWD` by
  # modules/nut.py at runtime. Wiring this is REQUIRED on fresh installs:
  # without monpwd, upsd exits silently (no log output) and `service.control
  # START ups` succeeds but the service stays STOPPED. Discovered on the
  # Beelink rebuild 2026-05-15. The module sets monpwd only when ups.config
  # reports it empty (idempotent + can't compare against the hidden live
  # value), so existing installs are untouched.
  monuser: upsmon

  # Free-form text appended to /etc/nut/ups.conf inside the [apc1]
  # section. Used for NUT driver-side directives that don't have a
  # dedicated TrueNAS field. Currently carries the LB-decision overrides
  # (Drill B follow-up, 2026-05-29):
  #
  #   ignorelb — Decouple the LB (Low Battery) decision from the UPS
  #     firmware's internal voltage cutoff. APC Smart-UPS LCC firmware
  #     has an internal voltage threshold that asserts LB independently
  #     of the configurable battery.runtime.low / battery.charge.low
  #     values, especially on a freshly-installed battery before the
  #     firmware's coulomb counter has been calibrated. During the
  #     2026-05-29 drill, the firmware asserted LB at battery.charge=62%
  #     / runtime=845s, well above our configured 660s threshold —
  #     because the internal voltage cutoff (NOT user-configurable)
  #     fired first. With `ignorelb` set, NUT evaluates LB strictly
  #     against the override.* values below, on every poll. Firmware's
  #     voltage cutoff stays as a hardware safety floor (it'll still
  #     yank power if voltage truly collapses) but it cannot prematurely
  #     flip the LB status flag that upsmon clients watch.
  #
  #   override.battery.charge.low = 75 — Triggers LB when SOC drops
  #     below 75%. RAISED from 50 on 2026-05-31 after the full drill:
  #     at 50% the battery hit ~5% (nearly dead) by the controlled UPS
  #     cut, because the slow Talos node shutdown (~6-8 min) + delay
  #     drained most of the reserve. 75% leaves ~14 min runtime in
  #     reserve when shutdown STARTS. Trade-off: gives up ride-through
  #     sooner (a ~4-5 min outage now triggers shutdown) — still rides
  #     out the routine ~90s grid blips. Revisit downward once the slow
  #     node shutdown is fixed.
  #
  #   override.battery.runtime.low = 420 — Secondary trigger (LB if estimated
  #     runtime drops below 7 min). History: 840→600 (kube-infra #611), then
  #     600→420 on 2026-08-01.
  #     840 sat inside the apcsmart runtime-estimate jitter band (read
  #     900-1260s at the SAME 99% charge), which (a) flapped false "battery
  #     low" alerts at full charge, and (b) let the on-battery transfer
  #     transient instantly trip LB → the master shut down in ~20s and
  #     orphaned the nodes.
  #
  #     ⚠ 600 did NOT sit clear of the jitter — that earlier claim was wrong.
  #     MEASURED 2026-08-01 via netdata (upsruntime/upscharge/upsload, 20-min
  #     window): at a FLAT battery.charge = 100.0% on mains, the runtime
  #     estimate swung 480–1260 s while UPS load swung 38–72%. The apcsmart
  #     runtime figure is derived from INSTANTANEOUS load, so a NAS write
  #     burst (scrub, resilver, Velero) drives the estimate below 600 and
  #     synthesises a false LB → a `UPSBatteryLow` alert at full charge, on
  #     mains, never having touched the battery. These alerts are `one_shot`
  #     (they never self-clear), so they accumulate until dismissed by hand.
  #     420 sits below the measured 480 s jitter floor.
  #
  #     Safety margin retained: the Path-B orchestrator brings all 6 nodes
  #     down in ~187 s (validated drill 2026-06-02), so 420 s is ~2.2x the
  #     measured need, and battery.charge.low = 60 remains the primary
  #     trigger for a genuine outage (charge does NOT jitter — it read a
  #     flat 100.0% throughout). Trade-off: on a real outage, shutdown now
  #     starts with 7 min of estimated reserve instead of 10.
  #     If the runtime estimator is ever seen dipping below 420 on mains,
  #     lower again rather than reverting — or drop the runtime override
  #     entirely and rely on charge.low alone.
  #
  #   override.battery.charge.low = 60 — Primary trigger. LOWERED 75→60:
  #     node shutdown is now ~3.2 min (poweroff --force, #611), so 60%
  #     leaves ample reserve AND restores more short-outage ride-through.
  #
  # Both override.* trigger via OR; whichever fires first wins.
  #
  #   sdtype = 5 (kube-infra #611, 2026-06-02) — apcsmart kill-power method:
  #     hard hibernate (`@`) ALWAYS, regardless of line state. The default
  #     (sdtype 0) is status-dependent: soft hibernate (`S`) on battery, `@`
  #     on mains — but `S` no-ops on mains, AND the #57 shutdown hook runs
  #     `upsdrvctl shutdown` as a transient instance that can't read status
  #     ("assuming LB+OB") so it wrongly picked `S` → the UPS armed=1 but
  #     never cut (drill 2026-06-01, on mains). sdtype=5 forces `@`
  #     unconditionally → the UPS cuts + auto-returns when power is present
  #     even on MAINS. VALIDATED live 2026-06-02: kill-power on mains →
  #     UPS counted down, cut, and power-cycled the rack back after
  #     delay.start (60s). Closes the "mains returns mid-drain → no
  #     auto-recovery" gap. `shutdown.return` (the INSTCMD) is a no-op on
  #     mains by design and is NOT the lever — the driver sdtype/`@` is.
  # Stored as a multi-line string; TrueNAS appends it verbatim to the
  # rendered ups.conf inside the [<identifier>] section.
  options: |
    ignorelb
    override.battery.charge.low = 60
    override.battery.runtime.low = 420
    sdtype = 5

  # HOSTSYNC (kube-infra #611, 2026-05-31): on FSD the master upsmon waits
  # up to this many seconds for the secondaries (6 K8s nodes) to disconnect
  # (= power off) BEFORE it shuts itself down — i.e. the NAS shuts down LAST.
  # Raised 15→300 so the nodes' ~3.2 min `poweroff --force` completes while
  # the NAS stays reachable to hold FSD; the master then proceeds the instant
  # the last node disconnects (it does NOT idle the full 300s). At the old 15s
  # the master gave up + powered off before the nodes finished → orphaned
  # them (the real-outage failure). NB: the nut-client extension thrashes on
  # FSD (siderolabs/extensions#1084), but --force makes machined complete the
  # poweroff in ~3.2 min regardless of the thrash.
  # NOTE: not yet wired into modules/nut.py reconcile — applied live via
  # `midclt call ups.update '{"hostsync":300}'`; codified here + follow-up to
  # add it to the reconciler so a NAS rebuild restores it.
  hostsync: 300

  # Additional NUT users beyond the primary `monuser`. Codified here so
  # a fresh NAS install / TrueNAS factory-reset rebuilds `upsd.users`
  # with the same role-separated identities — without this, the
  # operator's manual paste into the TrueNAS UI "Extra Users" field
  # is the only definition (fragile, no recovery path).
  #
  # Each entry maps to one `[user]` block in `/etc/nut/upsd.users` (via
  # TrueNAS `ups.config.extrausers`). The password comes from an env var
  # at apply time (Doppler-backed); never persisted in YAML.
  #
  # Doctrine: TWO ROLES, ZERO OVERLAP.
  #   - upsmon (declared above as `monuser`) — read-only, FSD-trigger.
  #     Used by K8s nodes' Talos nut-client (cluster fleet auth).
  #   - upsadmin (this entry) — SET + INSTCMD ALL. Used by operator
  #     scripts via the NOPASSWD sudo allowlist (see truenas-infra
  #     CLAUDE.md § SSH + sudo). Never used by K8s clients.
  #
  # See `wiki/docs/runbooks/ups-operations.md` for the full doctrine
  # + drill procedures.
  extra_users:
    - name: upsadmin
      password_env: TRUENAS_NUT_ADMINPWD
      actions: [SET]
      instcmds: [ALL]

  # UPS firmware HID thresholds — STORED IN THE UPS HARDWARE, not in
  # any NUT config file. A UPS firmware reset / battery-disconnect-
  # >24h / hot-spare swap silently reverts to APC factory defaults
  # without surfacing any signal. `modules/nut.py:check_ups_hid_thresholds`
  # diffs live values against this block on every `phase nut` run
  # (read-only — does NOT auto-reconcile; operator runs `upsrw -s`
  # manually if drift is reported). Drift detection only; enforcement
  # stays manual so the operator stays in the loop for UPS firmware
  # writes (which can brick a unit if the wrong value is set).
  #
  # See `wiki/docs/runbooks/ups-operations.md` § Threshold reference
  # for unit/rationale per setting + the fix command.
  ups_thresholds:
    # ups.delay.shutdown is an ENUM on apcsmart; valid values cap at 630
    # (090/180/270/360/450/540/630/000). Set to 450 (7.5 min) on
    # 2026-05-31 — trimmed from 630 now that Talos nodes power off in
    # ~3.2 min via SHUTDOWNCMD "/sbin/poweroff --force" (kube-infra #611),
    # not the old ~6-8 min drain path. 450s still leaves a wide margin over
    # the node poweroff + NAS halt; ratchet lower (360/270) later as real
    # outages confirm timing.
    # ⚠ HISTORICAL: this paragraph described the 2026-05-31 state, when the LB
    # triggers were charge.low 75 / runtime.low 840. Both have since moved —
    # CURRENT values are charge.low 60 / runtime.low 420 (see `options:` above,
    # which is the source of truth). runtime.low was lowered to 420 on
    # 2026-08-01 because the apcsmart runtime estimate jitters 480–1260 s at a
    # flat 100% charge under variable NAS load, firing false UPSBatteryLow
    # alerts on mains.
    ups_delay_shutdown: 90       # seconds — UPS kills outputs N sec after `shutdown.return`. Trimmed
                                 # 450→90 on 2026-06-01: the Path B orchestrator (NAS SHUTDOWNCMD)
                                 # confirms ALL nodes are down (poll 0/6) BEFORE the NAS halts+arms the
                                 # UPS — verified live (drill 2026-06-01: nodes down 187s, NAS last,
                                 # orchestrator "all nodes down at 8s" then halt). So this delay only has
                                 # to cover the NAS's own final poweroff. ENUM "090" SELECTED (live ✓).
    ups_delay_start: 60          # seconds (1 min) — UPS re-enables outputs after utility returns. ENUM "060" (live ✓).
    # battery.runtime.low (600s / 10 min) and battery.charge.low (50%) are
    # READ-ONLY on this UPS firmware (upsrw → ERR READONLY, confirmed
    # 2026-05-30). They are enforced instead via the driver-side
    # `override.*` directives in `options:` above (ignorelb + overrides),
    # which the live UPS reports as 420 / 60 (verified live 2026-08-01; the
    # earlier "600 / 50" in this comment was stale). Do NOT add them here
    # as firmware writes — they will always fail.
    # battery_runtime_low: 660   # seconds — firmware-clamped on Smart-UPS;
                                 #   APC derives this from battery.charge.low (10%)
                                 #   and rejects override attempts. Omitted from
                                 #   reconcile to avoid spurious drift reports.
    # ups_test_interval: 2419200 # seconds (28d) — firmware-rejected on our SMT750I
                                 #   model. APC default (14d auto-test) is what
                                 #   we get. Omitted from reconcile.

  # UPS alert-class tuning (kube-infra #611, 2026-05-31). TrueNAS UPS
  # notifications run through its alert framework (NOT NUT NOTIFYFLAG): each
  # event is an alert class with a level + policy, and the E-Mail alert
  # service emits at WARNING and above. NOT auto-reconciled — like the HID
  # thresholds above this lives in the TrueNAS config DB; declared here +
  # applied by hand (a NAS rebuild reverts to defaults, so re-apply after):
  #   ssh truenas_admin@10.10.5.10 "sudo midclt call alertclasses.update \
  #     '{\"classes\": {\"UPSBatteryLow\": {\"level\": \"ALERT\", \"policy\": \"HOURLY\"}, \
  #       \"UPSOnline\": {\"level\": \"WARNING\", \"policy\": \"IMMEDIATELY\"}}}'"
  # Rationale:
  #   - UPSOnBattery (CRITICAL, default) → emails on power loss. Kept as-is.
  #   - UPSOnline was INFO (below the WARNING email threshold, so "power back"
  #     never emailed) → bumped to WARNING so utility-restored notifies.
  #   - UPSBatteryLow flapped per threshold-crossing during post-outage
  #     recharge (per-event email spam) → throttled to HOURLY; still signals a
  #     genuine low battery during a real outage, just not 20×.
  #   - Other UPS* classes (Commbad/Commok/Replbatt/OnBattery) kept at default.
  alertclasses:
    UPSBatteryLow: { level: ALERT, policy: HOURLY }
    UPSOnline:     { level: WARNING, policy: IMMEDIATELY }

  # Power-event recovery flow (REQUIRED for clean cluster shutdown chain):
  # `powerdown: true` makes TrueNAS issue `upsdrvctl shutdown` → UPS
  # `shutdown.return` instruction at the end of the NAS poweroff. Without
  # this, after the cluster + NAS shut down, the UPS keeps running on
  # battery (still passing power to dead loads) until battery dies — a
  # second uncontrolled outage when utility eventually returns. Set 2026-05-28
  # via midclt; codified here so a future `phase nut --apply` won't drift it
  # back to TrueNAS's chart-default `false`.
  powerdown: true

  # ── shutdowncmd: Path B orchestrator (kube-infra #611) ────────────────────
  # The NAS NUT SHUTDOWNCMD is the SOLE host-poweroff path on TrueNAS
  # (ups.upssched_event SHUTDOWN only runs `upsmon -c fsd`). Path B points it at
  # the NAS-side orchestrator: on FSD/LB it fires `talosctl shutdown --force` at
  # all 6 nodes (least-privilege os:operator cred staged at
  # /mnt/tank/system/talos/), polls apid until 0/6, THEN runs `/sbin/shutdown -P
  # now` so the NAS halts LAST and the #57 Init/Shutdown hook arms the UPS.
  #
  # VALIDATED live (drill 2026-06-01, `upsmon -c fsd`): orchestrator fired
  # instantly (0 secondaries → no HOSTSYNC wait), all 6 nodes down in 187s
  # (~3.1 min via --force, the fast no-drain path), orchestrator logged "all
  # nodes down at 8s" then halted the NAS last. (#57 hook armed via the
  # `upsdrvctl` fallback; the UPS does NOT physically cut on MAINS — that's
  # expected APC on-line behaviour, so the kill-power itself still needs a real
  # on-battery AC-pull to confirm.)
  #
  # ⚠ STEADY-STATE PREREQUISITE: for the orchestrator to be the FAST path, the
  # nodes must NOT be NUT secondaries — otherwise the master waits HOSTSYNC for
  # them to self-shutdown (slow extension path) before running this. The drill
  # stopped `ext-nut-client` on all 6 (reversible); they restart it on reboot,
  # so the nut-client ExtensionServiceConfig must be persistently removed from
  # talos-os/patches/general.yaml + applied for the fast path to hold. Until
  # then this is wired but gated behind HOSTSYNC on a real outage. See #611.
  #
  # History: `sleep 90/300` here was tried + reverted (dangerous — drained the
  # rack); empty was the slow-but-safe baseline. Path B supersedes both.
  shutdowncmd: /mnt/tank/system/talos/nas-ups-orchestrator.sh

tls:
  internal_ca:
    enable: true
    export_path: docs/nas-internal-ca.pem
  acme:
    enable: false             # flip true once DNS provider is wired in
    domain: nas.w1.lv
    challenge: dns-01
    # provider: cloudflare    # or route53, mikrotik-internal, etc.
    # email: admin@w1.lv

# NOTE: there is intentionally no `system:` block here. Timezone (UTC) and
# NTP are set from `config/tunables.yaml § system` by `modules/tunables.py`.
# A former `system:` block in THIS file (timezone: Europe/Riga + a
# console_banner) was dead config — no module reads services.yaml's
# `system:` key (nut.py reads only `nut:`), and its Europe/Riga value
# contradicted the live UTC. Removed 2026-07-08.
