[project]
name = "truenas-infra"
version = "0.1.0"
description = "API-driven TrueNAS Community Edition 25.10 configuration for the homelab NAS"
# Floor is 3.10: the `truenas-api-client` dependency requires >=3.10, so a 3.9
# floor can't resolve (`uv sync` errors). The old ">=3.9 for macOS system
# Python" rationale never actually worked once that dep was added — macOS
# system Python is 3.9, which the client rejects anyway. Use any 3.10+ (the
# operator venv runs 3.14; `uv venv --python 3.12`+ all fine).
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # Official TrueNAS API client (JSON-RPC over WebSocket). REST is deprecated.
    # Pin to the 25.10 compatible branch.
    "truenas-api-client @ git+https://github.com/truenas/api_client.git@TS-25.10.3",
    "pydantic>=2.13.4",
    "structlog>=26.1.0",
    "PyYAML>=6.0.3",
    "click>=8.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.6",
    "mypy>=1.20.2",
    "types-PyYAML>=6.0.12.20260518",
]

[project.scripts]
truenas-infra = "truenas_infra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truenas_infra"]

[tool.hatch.metadata]
# truenas-api-client is installed from GitHub (no PyPI release for 25.10).
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line-length handled by formatter

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true
# truenas-api-client has no stubs yet
[[tool.mypy.overrides]]
module = ["truenas_api_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
