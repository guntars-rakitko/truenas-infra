# cluster-agent — LLM-driven SRE assistant for the homelab K8s clusters.
#
# Spec: truenas-infra/docs/superpowers/specs/2026-05-23-cluster-agent-design.md
# Repo home: apps/cluster-agent/
# Runbook: wiki.w1.lv/runbooks/cluster-agent-runbook (lands in Task 22)
#
# Secrets source: dedicated Doppler project cluster-agent/prd (migrated from
# infrastructure/ops in Task 22.5). Env var names match Doppler key names
# directly — no rename layer needed. The project is the namespace; no prefix.
#
# LLM auth (active path): CLAUDE_CODE_OAUTH_TOKEN — 1-year OAuth token from
# `claude setup-token`. Bills against the operator's Max subscription. Until
# June 15, 2026 calls share the rate-limit pool with interactive Claude Code;
# after June 15 they move to a separate $100/mo bucket. ANTHROPIC_API_KEY
# remains in Doppler as a documented fallback (operator-side compose toggle).
#
# Critical SDK behavior: if ANTHROPIC_API_KEY is set in the env, it silently
# shadows CLAUDE_CODE_OAUTH_TOKEN — we pass only one at a time. main.py also
# fails fast on container start if both happen to be set.
#
# Observability auth: Loki/Prometheus/Alertmanager are reached via the K8s
# API server's services/proxy endpoint using the kubeconfig SA token from
# Doppler — no basic-auth credentials needed. The OIDC-gated *.w1.lv
# hostnames are bypassed entirely. See tools/k8s_proxy.py.
# NOTE: the cluster-agent-readonly ClusterRole (kube-infra) must gain
# services/proxy GET on monitoring namespace before these tools work live.
#
# Image strategy: python:3.13-alpine base + persistent /venv. Self-healing
# venv rebuilds on Python version drift. App code uploaded by
# _ensure_cluster_agent_config_via_ctx
#
# WHY 3.13 (not 3.14 like amtctl): pydantic-core 2.10 doesn't yet publish
# `cpython-314-musllinux` wheels, so pip falls back to source-build on
# alpine, which needs Rust, and alpine's musl can't satisfy the cargo
# binary's glibc deps (libgcc_s.so.1 + _Unwind_* symbols). Bricked the
# container in a crash loop 2026-05-25 until logs revealed the cause.
# Python 3.13 has pre-built wheels — clean install, no Rust. Revisit when
# pydantic-core publishes cp314-musllinux (probably ~3-6 months out).
#
# Original comment (kept for context): self-healing venv rebuilds on Python
# version drift. App code uploaded by _ensure_cluster_agent_config_via_ctx
# (added in Task 8) to /mnt/tank/system/apps-config/cluster-agent/code/.
#
# Networking: egress to clusters + GH + Anthropic + S3.
# Ingress: Prometheus scrape on 9595, bound on BOTH data-VLAN IPs.
#
# Bind strategy (2026-05-25 fix): the original mgmt-VLAN bind
# (10.10.5.10:9595) silently broke in-cluster scrapes. Cilium's IPv4
# masquerade does NOT SNAT pod-to-external traffic on the same L3 as
# the node's mgmt interface — pod IPs (10.244.x.x) leaked out unrouted,
# NAS replies dropped, symptom = "context deadline exceeded".
# Fix: bind on both data-VLAN IPs (same pattern as MinIO's data-plane
# S3 API: 10.10.10.10:9000 for prd, 10.10.15.10:9000 for dev).
# Each cluster scrapes via its OWN data-VLAN IP (substituted per cluster
# in kube-infra via cluster-env.CLUSTER_NAS_DATA_IP). Same VLAN as the
# scraping node → direct L2 → no masquerade question.
services:
  cluster-agent:
    image: python:3.13-alpine@sha256:585f88f854292ed2e4c84b96f7f5a21a20a13cb84efdde7a67639aae93f46206
    container_name: cluster-agent
    restart: unless-stopped
    ports:
      # Each cluster scrapes the agent via its OWN data-VLAN IP — same
      # pattern as MinIO's data-plane API (10.10.10.10:9000 for prd,
      # 10.10.15.10:9000 for dev). Mgmt-VLAN bind was tried first (2026-05-24)
      # but Cilium's masquerade silently breaks pod→NAS traffic when both
      # endpoints share an L3 (mgmt VLAN, where node mgmt ifaces live).
      # See kube-infra PR for the matching Prometheus scrape target change.
      - "10.10.10.10:9595:9595"    # prd cluster scrapes here
      - "10.10.15.10:9595:9595"    # dev cluster scrapes here
    volumes:
      # App code — uploaded by manage.sh phase apps via
      # _ensure_cluster_agent_config_via_ctx in modules/apps.py (Task 8).
      - /mnt/tank/system/apps-config/cluster-agent/code:/app:ro
      # Writable state (SQLite DB, nightly-backed-up to MinIO)
      - /mnt/tank/system/apps-config/cluster-agent/data:/data
      # Persistent venv across image bumps
      - /mnt/tank/system/apps-config/cluster-agent/venv:/venv
    environment:
      # ── Identity / kill switches (source: cluster-agent/prd)
      - ENABLED=${ENABLED}
      - DISABLED_MODES=${DISABLED_MODES}
      # AUTOMERGE_DISABLED_REPOS removed 2026-05-27 — was reserved for
      # Mode J (Renovate auto-merge) which was never spec'd. If Mode J
      # is ever built, re-add the Doppler key + the line above.
      # ── Claude LLM auth (Doppler-driven toggle, 2026-05-26)
      # Both auth tokens are passed in unconditionally; the active one
      # is chosen by LLM_AUTH_MODE ("oauth" or "api_key"). main.py reads
      # LLM_AUTH_MODE at startup and removes the inactive key from
      # os.environ before any code path can read it. This means
      # operator can flip auth mode with:
      #
      #   doppler secrets set LLM_AUTH_MODE=oauth --project cluster-agent --config prd
      #   ssh truenas@nas 'sudo docker restart cluster-agent'
      #
      # without ever editing this compose file. See main.py header.
      #
      # CLAUDE_CODE_OAUTH_TOKEN (sk-ant-oat01-...) bills against the
      # operator's Max subscription. Pre-June-15, that pool is SHARED with
      # interactive Claude Code — concurrent usage by the operator can
      # rate-limit Mode A (429). Post-June-15 it's a separate $100/mo
      # bucket. Safe for daily-digest cadence: 2 calls/day at 06:00 EEST
      # (operator-asleep window) are extremely unlikely to overlap with
      # interactive use.
      #
      # ANTHROPIC_API_KEY (sk-ant-api03-...) bills against the regular
      # API account — completely independent quota, no interaction with
      # Max subscription.
      - LLM_AUTH_MODE=${LLM_AUTH_MODE}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      # ── GitHub App identity
      # Mode A onwards: the github tool (src/cluster_agent/tools/github.py)
      # reads CLUSTER_AGENT_GH_APP_* (matches the test fixtures); the
      # Doppler keys keep the GH_APP_* name to stay compact. Translate
      # at the compose layer.
      - CLUSTER_AGENT_GH_APP_ID=${GH_APP_ID}
      - CLUSTER_AGENT_GH_APP_PRIVATE_KEY=${GH_APP_PRIVATE_KEY}
      - CLUSTER_AGENT_GH_APP_INSTALLATION_ID=${GH_APP_INSTALLATION_ID}
      # ── K8s — read-only on both, narrow-writer in dev cluster-agent-tests ns.
      # These kubeconfigs also carry the SA token used by tools/k8s_proxy.py
      # to reach Loki/Prom/AM via the apiserver services/proxy endpoint.
      - KUBECONFIG_DEV=${KUBECONFIG_DEV}
      - KUBECONFIG_PRD=${KUBECONFIG_PRD}
      # KUBECONFIG_TEST_RESTORE_DEV removed 2026-05-27 (post-P3 wrap):
      # the SA token targeted the `cluster-agent-tests` ns on dev,
      # provisioned in P0 Task 2 for Mode G backup-verification.
      # Mode G is paused; the namespace + Role are removed in
      # kube-infra (same date). Re-provision via P0 Task 2 + 4 if
      # Mode G is ever revived.
      # ── Observability — Loki/Prom/AM + Grafana annotation API all reach
      # cluster services via apiserver-proxy (kubeconfig SA token), so no
      # separate annotation auth token is needed. Grafana itself runs in
      # auth.proxy mode (whitelist=""), trusts X-WEBAUTH-USER from the
      # proxy + auto-creates the cluster-agent user with Admin role.
      # (Old GRAFANA_API_TOKEN_{DEV,PRD} env vars dropped 2026-05-26 with
      # PR #42 — they were dead since the apiserver-proxy switch.)
      # ── S3 (Mode G backup verification) — keys removed 2026-05-27
      # (post-P3 wrap): MINIO_NAS_KEY_ID / MINIO_NAS_SECRET_KEY /
      # B2_KEY_ID / B2_APP_KEY were provisioned in P0 for the planned
      # Mode G backup-verification path. Mode G is paused; corresponding
      # MinIO `cluster-agent` user removed from nas-{dev,prd}, B2 app
      # key revoked. Re-provision via setup-minio-users.sh + Doppler
      # if Mode G is ever revived.
      # ── Runtime
      # /sbin is REQUIRED — `apk` lives at /sbin/apk on alpine, and the
      # startup script's `apk add kubectl mc curl jq sqlite` line
      # silently no-op'd (apk: not found, then `|| true` swallowed it)
      # when /sbin wasn't in PATH. Result: kubectl + mc + curl + jq +
      # sqlite missing from the container, Mode A's kubectl_describe
      # tool failed with FileNotFoundError. Caught 2026-05-26 after
      # MODE_A_CLUSTERS=dev,prd flip recreated the container.
      - PATH=/venv/bin:/usr/local/bin:/usr/bin:/sbin:/bin
      - PYTHONPATH=/app/src
      - STATE_DB_PATH=/data/state.db
      - LOG_LEVEL=INFO
      # ── Mode A (P1 / now P2 daily-digest)
      - SANDBOX_REPO=${SANDBOX_REPO}
      # Findings/summary routing (2026-07-06 graduation spec). FINDINGS_REPO
      # files individual findings in the ops repo (kube-infra); DIGEST_REPO
      # files the daily summary in the renamed digest repo. Both fall back
      # to SANDBOX_REPO in code (dispatch.py / daily_digest.py), so a
      # half-applied cutover never 0-outs output. FINDINGS_MIN_SEVERITY is
      # an inert floor (empty = every finding files).
      - DIGEST_REPO=${DIGEST_REPO}
      - FINDINGS_REPO=${FINDINGS_REPO}
      - FINDINGS_MIN_SEVERITY=${FINDINGS_MIN_SEVERITY}
      - LLM_MODEL=${LLM_MODEL}
      # MODE_A_CLUSTERS — per-cluster scheduler-time allowlist for Mode A.
      # Default "dev,prd"; operator can set to just "dev" to silence prd.
      - MODE_A_CLUSTERS=${MODE_A_CLUSTERS}
      # ── Daily-digest (P2 — 2026-05-26 pivot from 5-min polling)
      # One LLM call per cluster per day at DAILY_DIGEST_HOUR:DAILY_DIGEST_MINUTE
      # in the scheduler's timezone (Europe/Riga). prd job offsets +1
      # minute so the second call can hit Anthropic's 5-min prompt cache.
      - DAILY_DIGEST_HOUR=${DAILY_DIGEST_HOUR}
      - DAILY_DIGEST_MINUTE=${DAILY_DIGEST_MINUTE}
      - DAILY_DIGEST_WINDOW_HOURS=${DAILY_DIGEST_WINDOW_HOURS}
      - DAILY_DIGEST_BUDGET_USD=${DAILY_DIGEST_BUDGET_USD}
      # MODE_A_BUDGET_USD removed 2026-05-27 — was a P1-only key from
      # the 5-min polling model; daily_digest uses DAILY_DIGEST_BUDGET_USD.
      # If on-demand per-alert triage is ever revived, re-introduce.
      # DIGEST_SUMMARY — comma-separated destinations for the daily
      # summary that lists ALL alert groups (incl. chronic-but-known
      # noise the LLM didn't promote to a Finding). Zero LLM cost.
      # Values: "" (disabled), "issue", "email", "email,issue".
      # GH issue: cluster-agent-sandbox repo, label `digest-summary`,
      # auto-closes yesterday's. Email: SES SMTP via SHARED_SES_W1_*.
      # See modes/summary_issue.py + tools/email.py.
      - DIGEST_SUMMARY=${DIGEST_SUMMARY}
      - DIGEST_SUMMARY_EMAIL_TO=${DIGEST_SUMMARY_EMAIL_TO}
      # SES SMTP credentials — sourced from Doppler keys mirrored
      # from infrastructure/shr (single source of truth for the
      # cluster's email sender). The cluster-agent uses these to
      # deliver the daily-digest summary email. Same creds Alertmanager
      # + every other system sender uses; rotate in lockstep via
      # `doppler secrets set SHARED_SES_W1_SMTP_PASSWORD=... \
      # --project infrastructure --config shr` (canonical) AND
      # `doppler secrets set SES_SMTP_PASSWORD=... \
      # --project cluster-agent --config prd` (mirror).
      - SES_SMTP_HOST=${SES_SMTP_HOST}
      - SES_SMTP_PORT=${SES_SMTP_PORT}
      - SES_SMTP_USERNAME=${SES_SMTP_USERNAME}
      - SES_SMTP_PASSWORD=${SES_SMTP_PASSWORD}
      - SES_FROM_DEFAULT=${SES_FROM_DEFAULT}
    working_dir: /app
    command:
      - sh
      - -c
      - |
        set -e
        # Rebuild the venv if it's missing OR was built against a
        # different Python OR is missing any of the dependency markers
        # we add over time. The /venv bind-mount persists across image
        # bumps and ADDS-only-via-self-heal — i.e. when we add a new
        # `pip install` entry below, the check must include that
        # package's `import` line, else old venvs never pick it up.
        # Markers checked: uvicorn (P0), jinja2 (P1 prompt loader),
        # claude_agent_sdk (P1 LLM wrapper).
        if ! /venv/bin/python -c 'import uvicorn, jinja2, cryptography' 2>/dev/null; then
          echo "venv missing or stale — rebuilding…"
          python -m venv --clear /venv
          /venv/bin/pip install --no-cache-dir -q \
            'fastapi==0.118.*' \
            'uvicorn[standard]==0.35.*' \
            'apscheduler==3.10.*' \
            'prometheus_client==0.21.*' \
            'httpx==0.28.*' \
            'jinja2==3.1.*' \
            'pydantic==2.10.*' \
            'pyjwt[crypto]==2.10.*' \
            'tenacity==9.0.*' \
            'structlog==24.4.*' \
            'pyyaml==6.0.*'
          echo "venv ready"
        fi
        # Install kubectl + mc + curl + jq + sqlite (idempotent — apk skip
        # if present). Errors are NOT swallowed: `apk add` failing means
        # Mode A's kubectl_describe / mc tools won't work, so the container
        # should refuse to start rather than limping along. set -e at the
        # top of this script handles the propagation.
        if ! command -v kubectl >/dev/null 2>&1 || ! command -v mc >/dev/null 2>&1; then
          echo "installing kubectl + mc + curl + jq + sqlite..."
          apk add --no-cache kubectl mc curl jq sqlite
          # Hard verify — apk reports success even when packages aren't
          # registered as installed (rare race) and previously silently
          # broke kubectl_describe in the runtime. Refuse to continue
          # without the binaries on PATH.
          command -v kubectl >/dev/null 2>&1 || { echo "FATAL: kubectl missing after apk add" >&2; exit 1; }
          command -v mc      >/dev/null 2>&1 || { echo "FATAL: mc missing after apk add"      >&2; exit 1; }
          command -v curl    >/dev/null 2>&1 || { echo "FATAL: curl missing after apk add"    >&2; exit 1; }
          command -v jq      >/dev/null 2>&1 || { echo "FATAL: jq missing after apk add"      >&2; exit 1; }
          command -v sqlite3 >/dev/null 2>&1 || { echo "FATAL: sqlite3 missing after apk add" >&2; exit 1; }
        fi
        # gh CLI (alpine community) — same hard-verify pattern
        if ! command -v gh >/dev/null 2>&1; then
          apk add --no-cache github-cli
          command -v gh >/dev/null 2>&1 || { echo "FATAL: gh missing after apk add" >&2; exit 1; }
        fi
        cd /app
        exec /venv/bin/uvicorn main:app --host 0.0.0.0 --port 9595 --log-level info
    healthcheck:
      # Use python (guaranteed present — it's the base image) rather than
      # wget. The original `wget -q -O- http://localhost:9595/health`
      # failed silently inside `python:3.13-alpine` (Docker reported
      # unhealthy → TrueNAS Apps UI stuck on "Deploying" indefinitely
      # despite the container actually serving /metrics fine to
      # Prometheus). curl is apk-added at boot, but only AFTER the venv
      # build, which races the first healthcheck after a restart — so
      # we use python -c instead (no apk dependency, no race).
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9595/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Resource + capability hardening — first app on the NAS where these
    # matter materially. Other apps (amtctl, stress-dashboard) are
    # stateless HTTP dashboards with predictable resource usage and
    # don't need them. The cluster-agent has:
    #   - persistent state (SQLite at /data/state.db)
    #   - external API calls that can spike load (Anthropic LLM bursts)
    #   - subprocess forks (kubectl, gh, mc) with their own resource
    #     footprints
    #   - LLM-driven control flow that can in principle loop
    # mem_limit + cpus cap a runaway agent before it can starve the NAS
    # (Beelink ME Mini: 16GB RAM total, 4 weak N150 cores). cap_drop +
    # no-new-privileges are near-free defense-in-depth on top of the
    # GitHub App + read-only-SA + per-mode tool allowlist boundaries.
    mem_limit: 1g
    cpus: 1.0
    # Drop everything by default, then add back only the capabilities
    # python -m venv + pip install + apk add actually need:
    #   CHOWN, SETUID, SETGID: package install file-permission ops
    #   DAC_OVERRIDE, FOWNER: write to /venv from a fresh process; set file modes
    #   SETFCAP: required by some apk packages (alpine package install)
    # Container is still drop-by-default on the privileged caps (NET_ADMIN,
    # SYS_ADMIN, SYS_MODULE, NET_RAW, etc.) and keeps no-new-privileges.
    # Hypothesis-driven fix for 2026-05-25 crash-loop; iterate if logs prove
    # a different root cause.
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - SETFCAP
    security_opt:
      - no-new-privileges:true
    networks:
      - default

networks:
  default:
    driver: bridge
