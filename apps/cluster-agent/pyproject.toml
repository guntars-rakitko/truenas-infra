# cluster-agent — dependency source of truth (runtime AND tests).
#
# `[project].dependencies` below → `uv.lock` → `requirements.lock.txt` (a
# hashed `uv export` of the lock, committed next to it) → the container's
# /venv. docker-compose.yaml's startup script pip-installs EXACTLY that file
# (`--require-hashes --only-binary=:all:`) and rebuilds /venv whenever the
# file's sha256 changes, so the versions pytest ran against are the versions
# production runs. tests/test_requirements_lock.py fails if the export drifts
# from the lock or the lock from this file.
#
# After ANY change here or to uv.lock (Renovate bump, `uv lock --upgrade…`):
#
#   uv lock
#   uv export --frozen --no-dev --no-emit-project --format requirements-txt \
#     > requirements.lock.txt
#
# ⚠ Until 2026-09-29 the container ignored this file and pip-installed its own
# hand-written `==X.Y.*` pins, so the lock (and every Dependabot fix to it)
# never reached production. See truenas-infra CLAUDE.md § cluster-agent ops.
[project]
name = "cluster-agent"
version = "0.1.0"
description = "LLM-driven SRE assistant for homelab K8s clusters"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "apscheduler>=3.11.3",
    "prometheus_client>=0.25.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pyjwt[crypto]>=2.13.0",  # [crypto] extra pulls in cryptography for RS256 (GitHub App JWT signing)
    "tenacity>=9.1.4",
    "structlog>=26.1.0",
    "pyyaml>=6.0.3",  # imported directly by tools/k8s_proxy.py (kubeconfig parsing)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",       # httpx mocking for HTTP-client tools
    "freezegun>=1.5.5",    # time mocking for dedup / state-window tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cluster_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py313"
