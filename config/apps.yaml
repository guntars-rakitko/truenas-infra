# Declarative app registry.
# Consumed by modules/apps.py.
#
# Each entry points at a compose file under apps/<name>/docker-compose.yaml.
# Secrets are fetched at apply time from Doppler `infrastructure/ops`; the
# per-app key map lives in `_DOPPLER_KEYS_PER_APP` in modules/apps.py.
# `${VAR}` placeholders in compose files are substituted with Doppler values
# during `_render_compose`.
#
# ⚠️  WIKI MIRROR: Adding/removing a Custom App here ALSO requires updating:
#       wiki/docs/architecture/hostnames.md           (if it exposes a hostname)
#       wiki/docs/architecture/tls-split-horizon.md   (if it's admin or data plane)
#       wiki/docs/reference/links.md                  (if it has a browser URL)
#       apps/traefik/routes.yaml                      (if it's admin-plane, needs a route)
#       config/dns.yaml                               (if it needs a new DNS record)
#       src/truenas_infra/modules/verify.py           (+ check_app(...), + tls_https probe)
#     Then: ./manage.sh phase apps --apply && cd ~/github/wiki && ./tools/deploy.sh --verify

apps:
  # ⚠ SIX APPS RETIRED 2026-09-23 with the pool rebuild — pxe, meshcentral,
  # amtctl, homepage, iperf3, stress-dashboard. Reasons per app in
  # docs/superpowers/plans/2026-09-23-nas-pool-rebuild.md § Retire entirely.
  #
  # ⚠ meshcentral + amtctl existed ONLY to KVM into the Q170S1 nodes over
  # Intel AMT. The MS-A2 has no IPMI/BMC/vPro/AMT at all, so they have no
  # function on the new estate — not "unused for now", but unusable.
  # ⚠ iperf3 and stress-dashboard were both hw-validation dependents;
  # stress-dashboard bind-mounted /mnt/tank/system/stress-results, a dataset
  # this rebuild deletes, so it would have restored pointing at nothing.
  # ⚠ pxe is removed ENTIRELY (not Talos-only) — its cached images were built
  # for schematic daef782b… which carries intel-ucode on an AMD box, plus two
  # Longhorn-only extensions. See the plan's § Why PXE goes completely.
  #
  # SURVIVORS: minio-prd, minio-dev, traefik, wiki, cluster-agent (+ plex and
  # qbittorrent, both enabled:false with empty datasets).
  - name: minio-prd
    enabled: true
    compose: apps/minio-prd/docker-compose.yaml
    bind_ip: 10.10.10.10
    description: "S3 backend for prd Velero backups"

  - name: minio-dev
    enabled: true
    compose: apps/minio-dev/docker-compose.yaml
    bind_ip: 10.10.15.10
    description: "S3 backend for dev Velero backups"

  - name: traefik
    enabled: true
    compose: apps/traefik/docker-compose.yaml
    bind_ip: 10.10.5.20
    description: "Mgmt-plane reverse proxy (mc/pxe/minio-*/traefik-nas)"

  - name: wiki
    enabled: true
    compose: apps/wiki/docker-compose.yaml
    bind_ip: 10.10.5.10        # mgmt VLAN — Traefik proxies wiki.w1.lv here
    description: "Static internal wiki (MkDocs build served by nginx, pushed from wiki repo)"

  - name: cluster-agent
    enabled: true                              # Task 23: container live 2026-05-25
    compose: apps/cluster-agent/docker-compose.yaml
    bind_ip: 10.10.5.10                        # mgmt VLAN — K8s integration agent
    description: "Cluster agent for Anthropic Claude integration (K8s, observability, backups, GH)"

  # --- Deferred (media tier, out of scope for initial bring-up) ---
  - name: plex
    enabled: false
    compose: apps/plex/docker-compose.yaml
    bind_ip: 10.10.20.10
    description: "Plex Media Server"
  - name: qbittorrent
    enabled: false
    compose: apps/qbittorrent/docker-compose.yaml
    bind_ip: 10.10.20.10
    description: "qBittorrent Web UI"
