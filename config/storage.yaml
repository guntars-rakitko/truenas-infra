# Declarative storage config.
# Consumed by modules/pool.py, modules/datasets.py, modules/storage_tasks.py.

pool:
  name: tank
  topology:
    # ⚠ REBUILT 2026-09-23: 5-wide RAIDZ1 → 3-wide RAIDZ1. ZFS cannot remove a
    # device from a raidz vdev (expansion landed in OpenZFS 2.3; shrinking never
    # did), so this was destroy-and-recreate. Plan + rationale:
    # docs/superpowers/plans/2026-09-23-nas-pool-rebuild.md
    #
    # Going 5 → 3 drives is itself a 3.3V-rail mitigation: it removes two
    # drives' worth of peak SIMULTANEOUS current, which is the documented root
    # cause (docs/nvme-dropout-forensics.md). The PS2 figures below were
    # MEASURED per drive on 2026-09-23, not taken from datasheets.
    type: RAIDZ1
    #
    # ══ LIVE MAP, verified 2026-09-23 after the swap ═══════════════════════
    #   nvme0n1  Samsung 980 1TB  S/N S649NF1R820750Y   931.51 GiB  tank  PS2 2.19W
    #   nvme1n1  SM961 (MZVKW1T0HMLH) S/N S34DNX0JA02364 953.87 GiB tank  PS2 4.40W
    #   nvme2n1  PM981 256GB      S/N S444NX0N496890    238.47 GiB  boot-pool (EXCLUDED)
    #   nvme3n1  PM981a -000H7    S/N S4GSNF0N301379    953.87 GiB  tank  PS2 3.50W
    #
    # ⚠ THE TANK DISKS ARE NOT CONTIGUOUS — nvme2n1 (boot) sits between them.
    # ⚠ ENUMERATION CHANGED IN THE REBUILD: boot was nvme3n1 before, nvme2n1 now.
    # Match by SERIAL, never by device name. (Same trap as the 25.10.7 upgrade,
    # which swapped nvme1/nvme2 — see CLAUDE.md § Version Policy.)
    #
    # ⚠ MIXED CAPACITY: the 980 is 931.51 GiB, the other two 953.87 GiB. A raidz
    # vdev sizes to its SMALLEST member, so ~22 GiB is stranded on each of the
    # larger two (~45 GiB total). Expect ~1.75 TB usable, not 1.8.
    #
    # ⚠ MIXED MODELS is deliberate, not an oversight: three different firmware
    # families and power curves in one vdev. Accepted because drive availability
    # won over homogeneity. Combined PS2 draw is 10.09 W (2.19 + 4.40 + 3.50)
    # against ~8.87 W for the lowest-power trio — a 14% difference on a box that
    # just went from five drives to three, so not decisive.
    # ⚠ If a drive ever fails here, RECORD WHICH ONE. On a mixed vdev that
    # attribution is the only thing that teaches anything.
    #
    # ══ REMOVED 2026-09-23, and where they went ════════════════════════════
    #   S4GRNX1RB33857  PM981a-H1  → MS-A2 prd, system+apps   (0% used, 42 unsafe)
    #   S4GRNX0NA00357  PM981a-H1  → MS-A2 dev, system+apps   (⚠ 26,065 h, 74.8 TB
    #                                 written, 2% used — SMART-clean, which
    #                                 corroborates the July drops being Mode A
    #                                 / platform rail rather than the drive)
    #   S6H2NF0WC37390  PM9A1      → MS-A2 prd, Postgres      (0 err-log entries,
    #                                 15 unsafe — the cleanest drive measured)
    #   S6H2NF0WC37392  PM9A1      → MS-A2 dev, Postgres
    #     🚫 ⚠ THIS DRIVE HAS A MODE-B HISTORY. docs/nvme-dropout-forensics.md
    #     records an I/O-timeout cascade ending in `Device not ready; aborting
    #     reset, CSTS=0x1` — the controller ALIVE AND ANSWERING, i.e. a drive
    #     firmware hang, NOT a power event — and the fault FOLLOWED IT ACROSS A
    #     PHYSICAL RESLOT. SMART reads perfectly clean (2% used, 0 media errors,
    #     0 err-log entries), which is EXPECTED: SMART cannot see a firmware
    #     hang. A clean table is not exoneration.
    #     ⚠ Weak corroboration in the 2026-09-23 data: 51 unsafe shutdowns on
    #     342 power cycles, versus its twin's 15 on 751 — five times the
    #     hard-reset rate with half the cycles.
    #     Operator decision 2026-09-23: used on DEV, knowingly, as the lowest-
    #     stakes placement. If dev's Postgres hangs with that dmesg signature,
    #     it is this drive — not the MS-A2.
    #
    # ⚠ The 2026-07-06 reslot note that used to live here described a 5-wide
    # pool that no longer exists. Its lesson survives above: match by serial.
    disks:
      - nvme0n1   # Samsung 980      S649NF1R820750Y
      - nvme1n1   # SM961            S34DNX0JA02364
      - nvme3n1   # PM981a -000H7    S4GSNF0N301379
  ashift: 12
  # Disabled 2026-07-22 (Beelink ME Mini 3.3V-rail mitigation): with autotrim
  # ON, file deletes issue TRIM/deallocate bursts that spike simultaneous NVMe
  # current and drop a drive off the PCIe bus. This was the differentiator on
  # the 2026-07-22 drop (a retention-delete on the nightly talos-updater fired
  # a TRIM burst; quiet nights with equal write volume did not drop). Free
  # space is reclaimed by periodic manual `zpool trim tank` in a quiet window.
  # Reconciled by modules/pool.py::ensure_autotrim (non-destructive pool.update).
  autotrim: false

# Defaults applied to every dataset unless overridden.
defaults:
  compression: lz4
  atime: off
  xattr: sa
  recordsize: 128K

# Nested dataset tree.
# Environment-first grouping: /kube/<env>/<service> so that per-env policies
# (quota, snapshots, NFS exports) cleanly attach at the env parent.
datasets:
  - name: tank/kube
    kind: parent
  - name: tank/kube/prd
    kind: parent
  - name: tank/kube/prd/velero
    recordsize: 1M
  # tank/kube/prd/longhorn dataset removed 2026-04-27: Longhorn switched
  # to MinIO S3 BackupTarget on the same NAS (volume backups land in
  # bucket `longhorn` under the existing MinIO instance, not a separate
  # NFS-exported dataset). Closes kube-infra issue #26.
  - name: tank/kube/dev
    kind: parent
  - name: tank/kube/dev/velero
    recordsize: 1M
  # tank/kube/dev/longhorn dataset removed 2026-04-27, same as prd above.

  - name: tank/media
    quota: 4T
  - name: tank/media/plex
    kind: parent
  - name: tank/media/plex/config
  - name: tank/media/plex/media
  - name: tank/media/torrent
    kind: parent
  - name: tank/media/torrent/config
  - name: tank/media/torrent/downloads

  - name: tank/shared
    kind: parent
  - name: tank/shared/general
    quota: 1T

  - name: tank/system
    kind: parent
  - name: tank/system/pxe
    kind: parent
    # Subdirs tftp/ and http/ are not separate datasets — just regular
    # subdirectories under tank/system/pxe. apps/pxe/docker-compose.yaml
    # bind-mounts them as /srv/tftp and /srv/http.
    #
    # The legacy `config/` and `assets/` subdirs from the pre-rebuild
    # netboot.xyz era remain on disk until manually cleaned; they're not
    # referenced by anything the current stack uses.
  - name: tank/system/apps-config
    kind: parent
  - name: tank/system/apps-config/nut
  - name: tank/system/apps-config/talos-updater
  - name: tank/system/apps-config/meshcentral
  - name: tank/system/apps-config/traefik
  - name: tank/system/apps-config/wiki
    # Static MkDocs build + nginx.conf mounted read-only into the `wiki`
    # Custom App. Content pushed from the operator laptop via the wiki
    # repo's `tools/deploy.sh` (rsync over SSH).
  - name: tank/system/apps-config/homepage
    # Declarative YAML configs (services, bookmarks, widgets, settings,
    # docker, kubernetes) mounted read-only into the `homepage` app at
    # /app/config. Uploaded from apps/homepage/*.yaml by phase apps.
  - name: tank/system/apps-config/amtctl
    # AMT control sidecar — bind-mount target for code (amt.py, main.py,
    # web/index.html) + config (nodes.yaml) + persistent venv. Populated
    # by _ensure_amtctl_config_via_ctx in modules/apps.py.
  - name: tank/system/apps-config/pxe
    # PXE container build context (apps/pxe/build/** uploaded by phase
    # apps) + pxe-cache.sh + pxe-cache.log. docker-compose.yaml's
    # build.context points at /mnt/tank/system/apps-config/pxe/build
    # so the Dockerfile is resolvable when TrueNAS runs the build.
  - name: tank/system/tls
    # Wildcard *.w1.lv cert exported here by apps/tls/tls-export.sh so
    # containers (Traefik, MinIO prd+dev) can bind-mount read-only.
  - name: tank/system/stress-results
    # NFS export target for the hw-validation PXE image. Each test run
    # lands a {hostname}-{iso8601}.json report. Read by a (future)
    # dashboard that renders a per-node pass/fail matrix. Served over
    # the mgmt VLAN (NIC1) so reports still land even when NIC2
    # (I226-V, which is ITSELF one of the validation subjects) is
    # broken — a scenario we've already hit on kub-dev-02.

# Storage tasks.
scrub:
  schedule: "0 4 * * 0"   # Sunday 04:00

smart:
  short_test:
    schedule: "0 2 * * 0"        # Sunday 02:00
    disks: all
  long_test:
    schedule: "0 3 1-7 * 0"      # First Sunday of the month, 03:00
    disks: all

snapshots:
  # Per-environment recursive snapshots: one task per env covers all
  # K8s-tracked datasets atomically. Today that's just velero (after
  # longhorn was removed 2026-04-27 — closes kube-infra #26); the
  # recursive task auto-picks-up future siblings if added.
  - dataset: tank/kube/prd
    recursive: true
    schedule: "0 1 * * *"         # daily 01:00
    retention_days: 14
  - dataset: tank/kube/dev
    recursive: true
    schedule: "0 1 * * *"
    retention_days: 7
  - dataset: tank/media
    recursive: true
    schedule: "0 5 * * 0"         # weekly Sun 05:00
    retention_weeks: 4
  - dataset: tank/shared/general
    schedule: "0 2 * * *"
    retention_days: 14
  - dataset: tank/system
    recursive: true
    schedule: "30 2 * * *"
    retention_days: 7
