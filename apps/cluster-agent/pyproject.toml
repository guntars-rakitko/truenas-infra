# cluster-agent — local dev/test pyproject.
#
# This is NOT consumed by the container (the container uses an inline
# self-healing venv bootstrap in docker-compose.yaml — see the `command:`
# block). pyproject.toml exists purely for laptop-side pytest iteration:
# the operator builds a .venv with these deps, runs pytest, gets fast
# feedback before the container deploy in Task 23.
#
# Dependency parity is operator's responsibility — when adding a new
# runtime dep to the container's inline pip install in docker-compose.yaml,
# add it here too so tests can see it.
[project]
name = "cluster-agent"
version = "0.1.0"
description = "LLM-driven SRE assistant for homelab K8s clusters"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.32",
    "apscheduler>=3.10",
    "prometheus_client>=0.21",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pydantic>=2.10",
    "pyjwt[crypto]>=2.10",  # [crypto] extra pulls in cryptography for RS256 (GitHub App JWT signing)
    "tenacity>=9.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "respx>=0.22",       # httpx mocking for HTTP-client tools
    "freezegun>=1.5",    # time mocking for dedup / state-window tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cluster_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py313"
